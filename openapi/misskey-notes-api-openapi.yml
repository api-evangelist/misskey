  /notes/create:
    post:
      operationId: post___notes___create
      summary: notes/create
      description: 'No description provided.


        **Credential required**: *Yes* / **Permission**: *write:notes*'
      externalDocs:
        description: Source code
        url: https://github.com/MisskeyIO/misskey/blob/io/packages/backend/src/server/api/endpoints/notes/create.ts
      tags:
      - notes
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility:
                  type: string
                  enum:
                  - public
                  - home
                  - followers
                  - specified
                  default: public
                visibleUserIds:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    format: misskey:id
                cw:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 100
                localOnly:
                  type: boolean
                  default: false
                dimension:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                reactionAcceptance:
                  type:
                  - string
                  - 'null'
                  enum:
                  - null
                  - likeOnly
                  - likeOnlyForRemote
                  - nonSensitiveOnly
                  - nonSensitiveOnlyForLocalLikeOnlyForRemote
                  default: null
                noExtractMentions:
                  type: boolean
                  default: false
                noExtractHashtags:
                  type: boolean
                  default: false
                noExtractEmojis:
                  type: boolean
                  default: false
                replyId:
                  type:
                  - string
                  - 'null'
                  format: misskey:id
                renoteId:
                  type:
                  - string
                  - 'null'
                  format: misskey:id
                channelId:
                  type:
                  - string
                  - 'null'
                  format: misskey:id
                lang:
                  type:
                  - string
                  - 'null'
                  enum:
                  - null
                  - ja
                  - ja-JP
                  - ko
                  - ko-KR
                  - other
                text:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 3000
                fileIds:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  maxItems: 16
                  items:
                    type: string
                    format: misskey:id
                mediaIds:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  maxItems: 16
                  items:
                    type: string
                    format: misskey:id
                poll:
                  type:
                  - object
                  - 'null'
                  properties:
                    choices:
                      type: array
                      uniqueItems: true
                      minItems: 2
                      maxItems: 10
                      items:
                        type: string
                        minLength: 1
                        maxLength: 50
                    multiple:
                      type: boolean
                    expiresAt:
                      type:
                      - integer
                      - 'null'
                    expiredAfter:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                  required:
                  - choices
                scheduledAt:
                  type:
                  - integer
                  - 'null'
                noCreatedNote:
                  type: boolean
                  default: false
              if:
                properties:
                  renoteId:
                    type: 'null'
                  fileIds:
                    type: 'null'
                  mediaIds:
                    type: 'null'
                  poll:
                    type: 'null'
              then:
                properties:
                  text:
                    type: string
                    minLength: 1
                    maxLength: 3000
                    pattern: '[^\s]+'
                required:
                - text
      responses:
        '200':
          description: OK (with results)
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdNote:
                    type: object
                    $ref: '#/components/schemas/Note'
                required:
                - createdNote
        '204':
          description: OK (without any results)
        '400':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROCESSING:
                  value:
                    error:
                      message: We are processing your request. Please wait a moment.
                      code: PROCESSING
                      id: 3247052c-005d-440e-b3d8-2a64274483b0
                      httpStatusCode: 202
                NO_SUCH_RENOTE_TARGET:
                  value:
                    error:
                      message: No such renote target.
                      code: NO_SUCH_RENOTE_TARGET
                      id: b5c90186-4ab0-49c8-9bba-a1f76c282ba4
                CANNOT_RENOTE_TO_A_PURE_RENOTE:
                  value:
                    error:
                      message: You can not Renote a pure Renote.
                      code: CANNOT_RENOTE_TO_A_PURE_RENOTE
                      id: fd4cc33e-2a37-48dd-99cc-9b806eb2031a
                CANNOT_RENOTE_DUE_TO_VISIBILITY:
                  value:
                    error:
                      message: You can not Renote due to target visibility.
                      code: CANNOT_RENOTE_DUE_TO_VISIBILITY
                      id: be9529e9-fe72-4de0-ae43-0b363c4938af
                NO_SUCH_REPLY_TARGET:
                  value:
