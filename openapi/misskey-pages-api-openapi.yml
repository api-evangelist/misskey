  title: Misskey account pages API
servers:
- url: https://misskey.io/api
tags:
- name: pages
paths:
  /pages/create:
    post:
      operationId: post___pages___create
      summary: pages/create
      description: 'No description provided.


        **Credential required**: *Yes* / **Permission**: *write:pages*'
      externalDocs:
        description: Source code
        url: https://github.com/MisskeyIO/misskey/blob/io/packages/backend/src/server/api/endpoints/pages/create.ts
      tags:
      - pages
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                name:
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                  minLength: 1
                summary:
                  type:
                  - string
                  - 'null'
                content:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                variables:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                script:
                  type: string
                eyeCatchingImageId:
                  type:
                  - string
                  - 'null'
                  format: misskey:id
                font:
                  type: string
                  enum:
                  - serif
                  - sans-serif
                  default: sans-serif
                alignCenter:
                  type: boolean
                  default: false
                hideTitleWhenPinned:
                  type: boolean
                  default: false
                visibility:
                  type: string
                  enum:
                  - public
                  - private
              required:
              - title
              - name
              - content
              - variables
              - script
      responses:
        '200':
          description: OK (with results)
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/Page'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NO_SUCH_FILE:
                  value:
                    error:
                      message: No such file.
                      code: NO_SUCH_FILE
                      id: b7b97489-0f66-4b12-a5ff-b21bd63f6e1c
                NAME_ALREADY_EXISTS:
                  value:
                    error:
                      message: Specified name already exists.
                      code: NAME_ALREADY_EXISTS
                      id: 4650348e-301c-499a-83c9-6aa988c66bc1
                INVALID_PARAM:
                  value:
                    error:
                      message: Invalid param.
                      code: INVALID_PARAM
                      id: 3d81ceae-475f-4600-b2a8-2bc116157532
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CREDENTIAL_REQUIRED:
                  value:
                    error:
                      message: Credential required.
                      code: CREDENTIAL_REQUIRED
                      id: 1384574d-a912-4b81-8601-c7b1c4085df1
        '403':
          description: Forbidden error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AUTHENTICATION_FAILED:
                  value:
                    error:
                      message: Authentication failed. Please ensure your token is correct.
                      code: AUTHENTICATION_FAILED
                      id: b0a7f5f8-dc2f-4171-b91f-de88ad238e14
        '418':
          description: I'm Ai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
