          - 'null'
          format: id
        winner:
          type:
          - object
          - 'null'
          anyOf:
          - $ref: '#/components/schemas/UserLite'
          - type: 'null'
        surrenderedUserId:
          type:
          - string
          - 'null'
          format: id
        timeoutUserId:
          type:
          - string
          - 'null'
          format: id
        black:
          type:
          - number
          - 'null'
        bw:
          type: string
        noIrregularRules:
          type: boolean
        isLlotheo:
          type: boolean
        canPutEverywhere:
          type: boolean
        loopedBoard:
          type: boolean
        timeLimitForEachTurn:
          type: number
      required:
      - id
      - createdAt
      - startedAt
      - endedAt
      - isStarted
      - isEnded
      - user1Id
      - user2Id
      - user1
      - user2
      - winnerId
      - winner
      - surrenderedUserId
      - timeoutUserId
      - black
      - bw
