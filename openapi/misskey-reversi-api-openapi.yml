        endedAt:
          type:
          - string
          - 'null'
          format: date-time
        isStarted:
          type: boolean
        isEnded:
          type: boolean
        user1Id:
          type: string
          format: id
        user2Id:
          type: string
          format: id
        user1:
          type: object
          $ref: '#/components/schemas/UserLite'
        user2:
          type: object
          $ref: '#/components/schemas/UserLite'
        winnerId:
          type:
