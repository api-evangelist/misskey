  /i/2fa/register-key:
    post:
      operationId: post___i___2fa___register-key
      summary: i/2fa/register-key
      description: 'No description provided.


        **Internal Endpoint**: This endpoint is an API for the misskey mainframe and is not intended for use by third parties.

        **Credential required**: *Yes*'
      externalDocs:
        description: Source code
        url: https://github.com/MisskeyIO/misskey/blob/io/packages/backend/src/server/api/endpoints/i/2fa/register-key.ts
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                token:
                  type:
                  - string
                  - 'null'
              required:
              - password
      responses:
        '200':
          description: OK (with results)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rp:
                    type: object
                    properties:
                      id:
                        type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      displayName:
                        type: string
                    required:
                    - id
                    - name
                    - displayName
                  challenge:
                    type: string
                  pubKeyCredParams:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        alg:
                          type: number
                      required:
                      - type
                      - alg
                  timeout:
                    type:
                    - number
                    - 'null'
                  excludeCredentials:
                    type:
                    - array
                    - 'null'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        transports:
                          type: array
                          items:
                            type: string
                            enum:
                            - ble
                            - cable
                            - hybrid
                            - internal
                            - nfc
                            - smart-card
                            - usb
                      required:
                      - id
                      - type
                      - transports
                  authenticatorSelection:
                    type:
                    - object
                    - 'null'
                    properties:
                      authenticatorAttachment:
                        type: string
                        enum:
                        - cross-platform
                        - platform
                      requireResidentKey:
                        type: boolean
                      userVerification:
                        type: string
                        enum:
                        - discouraged
                        - preferred
                        - required
                    required:
                    - authenticatorAttachment
                    - requireResidentKey
                    - userVerification
                  attestation:
                    type:
                    - string
                    - 'null'
                    enum:
                    - direct
                    - enterprise
                    - indirect
                    - none
                    - null
                  extensions:
                    type:
                    - object
                    - 'null'
                    properties:
                      appid:
                        type:
                        - string
                        - 'null'
                      credProps:
                        type:
                        - boolean
                        - 'null'
                      hmacCreateSecret:
                        type:
                        - boolean
                        - 'null'
                    required:
                    - appid
                    - credProps
                    - hmacCreateSecret
                required:
                - rp
                - user
                - challenge
                - pubKeyCredParams
                - timeout
                - excludeCredentials
                - authenticatorSelection
                - attestation
                - extensions
        '400':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                USER_NOT_FOUND:
                  value:
                    error:
                      message: User not found.
                      code: USER_NOT_FOUND
                      id: 652f899f-66d4-490e-993e-6606c8ec04c3
