paths:
  /admin/system-webhook/test:
    post:
      operationId: post___admin___system-webhook___test
      summary: admin/system-webhook/test
      description: 'No description provided.


        **Internal Endpoint**: This endpoint is an API for the misskey mainframe and is not intended for use by third parties.

        **Credential required**: *Yes* / **Permission**: *read:admin:system-webhook*'
      externalDocs:
        description: Source code
        url: https://github.com/MisskeyIO/misskey/blob/io/packages/backend/src/server/api/endpoints/admin/system-webhook/test.ts
      tags:
      - webhooks
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookId:
                  type: string
                  format: misskey:id
                type:
                  type: string
                  enum:
                  - abuseReport
                  - abuseReportResolved
                  - userCreated
                  - inactiveModeratorsWarning
                  - inactiveModeratorsInvitationOnlyChanged
                  - reportAutoResolved
                override:
                  type: object
                  properties:
                    url:
                      type: string
                    secret:
                      type: string
              required:
              - webhookId
              - type
      responses:
        '204':
          description: OK (without any results)
        '400':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NO_SUCH_WEBHOOK:
                  value:
                    error:
                      message: No such webhook.
                      code: NO_SUCH_WEBHOOK
                      id: 0c52149c-e913-18f8-5dc7-74870bfe0cf9
                INVALID_PARAM:
                  value:
                    error:
                      message: Invalid param.
                      code: INVALID_PARAM
                      id: 3d81ceae-475f-4600-b2a8-2bc116157532
        '401':
