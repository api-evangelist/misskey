  /i/webhooks/create:
    post:
      operationId: post___i___webhooks___create
      summary: i/webhooks/create
      description: 'No description provided.


        **Credential required**: *Yes* / **Permission**: *write:account*'
      externalDocs:
        description: Source code
        url: https://github.com/MisskeyIO/misskey/blob/io/packages/backend/src/server/api/endpoints/i/webhooks/create.ts
      tags:
      - webhooks
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                url:
                  type: string
                  minLength: 1
                  maxLength: 1024
                secret:
                  type: string
                  maxLength: 1024
                  default: ''
                'on':
                  type: array
                  items:
                    type: string
                    enum:
                    - mention
                    - unfollow
                    - follow
                    - followed
                    - note
                    - reply
                    - renote
                    - reaction
                    - reportCreated
                    - reportResolved
                    - reportAutoResolved
              required:
              - name
              - url
              - 'on'
      responses:
        '200':
          description: OK (with results)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: misskey:id
                  userId:
                    type: string
                    format: misskey:id
                  name:
                    type: string
                  'on':
                    type: array
                    items:
                      type: string
                      enum:
                      - mention
                      - unfollow
                      - follow
                      - followed
                      - note
                      - reply
                      - renote
                      - reaction
                      - reportCreated
                      - reportResolved
                      - reportAutoResolved
                  url:
                    type: string
                  secret:
                    type: string
                  active:
                    type: boolean
                  latestSentAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  latestStatus:
                    type:
                    - integer
                    - 'null'
                required:
                - id
                - userId
                - name
                - 'on'
                - url
                - secret
                - active
                - latestSentAt
                - latestStatus
        '400':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TOO_MANY_WEBHOOKS:
                  value:
                    error:
                      message: You cannot create webhook any more.
                      code: TOO_MANY_WEBHOOKS
                      id: 87a9bb19-111e-4e37-81d3-a3e7426453b0
                YOU_ARE_NOT_ADMIN:
                  value:
                    error:
                      message: You are not an administrator.
                      code: YOU_ARE_NOT_ADMIN
                      id: 26601bea-079b-4782-8dac-071febe2acf9
                INVALID_PARAM:
