  /bubble-game/register:
    post:
      operationId: post___bubble-game___register
      summary: bubble-game/register
      description: 'No description provided.


        **Credential required**: *Yes* / **Permission**: *write:account*'
      externalDocs:
        description: Source code
        url: https://github.com/MisskeyIO/misskey/blob/io/packages/backend/src/server/api/endpoints/bubble-game/register.ts
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
                  minimum: 0
                seed:
                  type: string
                  minLength: 1
                  maxLength: 1024
                logs:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                gameMode:
                  type: string
                gameVersion:
                  type: integer
              required:
              - score
              - seed
              - logs
              - gameMode
              - gameVersion
      responses:
        '204':
          description: OK (without any results)
        '400':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_SEED:
                  value:
                    error:
                      message: Provided seed is invalid.
                      code: INVALID_SEED
                      id: eb627bc7-574b-4a52-a860-3c3eae772b88
                INVALID_PARAM:
                  value:
                    error:
                      message: Invalid param.
                      code: INVALID_PARAM
                      id: 3d81ceae-475f-4600-b2a8-2bc116157532
        '401':
