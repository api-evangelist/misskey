            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: misskey:id
                    createdAt:
                      type: string
                      format: date-time
                    userId:
                      type: string
                      format: misskey:id
                    user:
                      type: object
                      $ref: '#/components/schemas/UserLite'
                    withReplies:
                      type: boolean
                  required:
