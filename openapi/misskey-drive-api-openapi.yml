  /drive/files/create:
    post:
      operationId: post___drive___files___create
      summary: drive/files/create
      description: 'Upload a new drive file.


        **Credential required**: *Yes* / **Permission**: *write:drive*'
      externalDocs:
        description: Source code
        url: https://github.com/MisskeyIO/misskey/blob/io/packages/backend/src/server/api/endpoints/drive/files/create.ts
      tags:
      - drive
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                folderId:
                  type:
                  - string
                  - 'null'
                  format: misskey:id
                  default: null
                name:
                  type:
                  - string
                  - 'null'
                  default: null
                comment:
                  type:
                  - string
                  - 'null'
                  maxLength: 512
                  default: null
                isSensitive:
                  type: boolean
                  default: false
                force:
                  type: boolean
                  default: false
                file:
                  type: string
                  format: binary
                  description: The file contents.
              required:
              - file
      responses:
        '200':
          description: OK (with results)
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/DriveFile'
        '400':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_PARAM:
                  value:
                    error:
                      message: Invalid param.
                      code: INVALID_PARAM
                      id: 3d81ceae-475f-4600-b2a8-2bc116157532
                PROCESSING:
                  value:
                    error:
                      message: We are processing your request. Please wait a moment.
                      code: PROCESSING
                      id: b495d816-b077-4dc1-b135-7fde73fcca5e
                      httpStatusCode: 202
                INVALID_FILE_NAME:
                  value:
                    error:
                      message: Invalid file name.
                      code: INVALID_FILE_NAME
                      id: f449b209-0c60-4e51-84d5-29486263bfd4
                INAPPROPRIATE:
                  value:
                    error:
                      message: Cannot upload the file because it has been determined that it possibly contains inappropriate content.
                      code: INAPPROPRIATE
                      id: bec5bd69-fba3-43c9-b4fb-2894b66ad5d2
                NO_FREE_SPACE:
                  value:
                    error:
                      message: Cannot upload the file because you have no free space of drive.
                      code: NO_FREE_SPACE
                      id: d08dbc37-a6a9-463a-8c47-96c32ab5f064
                MAX_FILE_SIZE_EXCEEDED:
