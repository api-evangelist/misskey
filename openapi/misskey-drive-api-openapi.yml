  /drive/files:
    post:
      operationId: post___drive___files
      summary: drive/files
      description: 'No description provided.


        **Credential required**: *Yes* / **Permission**: *read:drive*'
      externalDocs:
        description: Source code
        url: https://github.com/MisskeyIO/misskey/blob/io/packages/backend/src/server/api/endpoints/drive/files.ts
      tags:
      - drive
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                sinceId:
                  type: string
                  format: misskey:id
                untilId:
                  type: string
                  format: misskey:id
                folderId:
                  type:
                  - string
                  - 'null'
                  format: misskey:id
                  default: null
                type:
                  type:
                  - string
                  - 'null'
                  pattern: ^[a-zA-Z\/\-*]+$
                sort:
                  type:
                  - string
                  - 'null'
                  enum:
                  - +createdAt
                  - -createdAt
                  - +name
                  - -name
                  - +size
                  - -size
                  - null
      responses:
        '200':
          description: OK (with results)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '#/components/schemas/DriveFile'
        '400':
