    description: >-
      Misskey provides a comprehensive HTTP and streaming API for building clients,
      integration web services, bots, and similar applications. All HTTP API endpoints
      use POST requests with JSON request and response bodies. The API covers notes
      (posts), users, timelines, follows, drives, channels, notifications, federation
      via ActivityPub, and administrative operations. Authentication uses access tokens
      via the MiAuth flow or personal token generation, passed as the i parameter in
      the request body or via an Authorization Bearer header.
