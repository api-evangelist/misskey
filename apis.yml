description: >-
  Misskey is a free, open-source, decentralized microblogging platform that implements
  the ActivityPub protocol, enabling federation across independent instances and
  interoperability with other fediverse software such as Mastodon and Pleroma. Users
  create and share content called Notes, which can contain text, images, videos, polls,
  and custom emoji formatted with MFM (Markup language For Misskey). All platform
  functionality is accessible via an HTTP API and a real-time streaming API, making it
  straightforward to build clients, bots, and integrations. The project is licensed
  under AGPL-3.0 and maintained by the misskey-dev community.
