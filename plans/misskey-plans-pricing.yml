specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Misskey
providerId: misskey
created: '2026-06-13'
modified: '2026-06-13'
tags:
  - Open-Source
  - Social Networks
  - Fediverse
  - ActivityPub
  - Decentralized
description: >-
  Misskey is free and open-source software (AGPL-3.0). There are no centralized paid
  tiers from the Misskey project itself. Any instance operator may run Misskey at no
  software licensing cost. Managed hosting costs depend on the chosen hosting provider
  or self-hosting infrastructure. The plan definitions below reflect the open-source
  self-hosted model and illustrative managed-hosting tiers.
plans:
  - id: misskey-self-hosted
    name: Self-Hosted (Free)
    type: free
    description: >-
      Run your own Misskey instance on your own infrastructure at no software cost.
      API access is unrestricted by the software itself; rate limits are configurable
      by the instance administrator. Suitable for individuals, communities, and
      organizations that prefer full data sovereignty.
    entries:
      - label: API Requests
        description: No centrally imposed request quota; limits set by instance admin
        name: api_requests
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Default per-endpoint rate limit configurable by instance admin
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 60
        timeFrame: minute
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Full API Access
      - name: ActivityPub Federation
      - name: Streaming API
      - name: misskey-js SDK
      - name: MiAuth OAuth Flow
      - name: Community Support
      - name: Misskey API
  - id: misskey-managed-starter
    name: Managed Hosting - Starter
    type: freemium
    description: >-
      Entry-level managed Misskey instance offered by third-party hosting providers
      such as Elestio. Pricing and limits vary by provider. Representative scaffold
      values are provided; consult your chosen host for actual pricing.
    entries:
      - label: API Requests
        description: Monthly API request quota typical of entry managed hosting
        name: api_requests
        type: quota
        metric: requests
        limit: 50000
        timeFrame: month
        geo: global
        domains: []
        unit: 1
        price: TBD
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on a starter managed instance
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 60
        timeFrame: minute
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Managed Infrastructure
      - name: Automatic Updates
      - name: Basic Support
      - name: Misskey API
  - id: misskey-managed-enterprise
    name: Managed Hosting - Enterprise
    type: enterprise
    description: >-
      Custom-negotiated managed Misskey deployment. Includes dedicated capacity,
      contractual SLAs, security review, data residency options, and named technical
      account management. Pricing and limits are negotiated directly with the hosting
      provider.
    entries:
      - label: API Requests
        description: Negotiated request volume; -1 indicates uncapped subject to fair use
        name: api_requests
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: configurable
        domains: []
        unit: 1
        price: custom
        userMultiplied: false
      - label: Rate Limit
        description: Negotiated burst and steady-state rate
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 1000
        timeFrame: minute
        geo: configurable
        domains: []
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Unlimited / Negotiated Volume
      - name: 24/7 Dedicated Support
      - name: Contractual SLA
      - name: Security and Compliance Review
      - name: Dedicated Account Manager
      - name: Custom Data Residency
      - name: Misskey API
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
